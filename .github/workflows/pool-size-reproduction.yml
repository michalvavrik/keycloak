            ports:
            - port: 5432
          EOF

          kubectl create secret generic keycloak-db-secret \
            --from-literal=username=testuser \
            --from-literal=password=testpassword

          kubectl wait --for=condition=ready --timeout=120s pod -l app=postgresql-db

      - name: Deploy with additionalOptions workaround
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: k8s.keycloak.org/v2alpha1
          kind: Keycloak
          metadata:
            name: test-additionaloptions
          spec:
            instances: 1
            db:
              vendor: postgres
              host: postgres-db
              usernameSecret:
                name: keycloak-db-secret
                key: username
              passwordSecret:
                name: keycloak-db-secret
                key: password
              poolInitialSize: 1
              poolMinSize: 2
              poolMaxSize: 3
            hostname:
              hostname: test.local
              strict: false
            http:
              httpEnabled: true
            additionalOptions:
              - name: shutdown-delay
                value: "0s"
              - name: db-pool-max-size
                value: "50"
          EOF

      - name: Wait and verify it still fails
        run: |
          echo "Waiting 180 seconds for Keycloak startup..."
          sleep 180

          echo "=== Pod Status ==="
          kubectl get pods -l app=keycloak

          echo -e "\n=== Saving logs to file and verifying additionalOptions workaround doesn't fix the issue ==="
          kubectl logs test-additionaloptions-0 2>&1 > /tmp/keycloak-logs.txt

          if grep -qi "sorry" /tmp/keycloak-logs.txt && grep -qi "acquisition" /tmp/keycloak-logs.txt && grep -qi "timeout" /tmp/keycloak-logs.txt; then
            echo "✅ SUCCESS: Confirmed that additionalOptions workaround does NOT fix the issue!"
            echo "The spec.db.poolMaxSize takes precedence over additionalOptions"
            grep -i "acquisition" /tmp/keycloak-logs.txt | grep -i "timeout" | head -5 || true
            echo -e "\n=== Full pod logs ==="
            cat /tmp/keycloak-logs.txt
            exit 0
          else
            echo "❌ UNEXPECTED: additionalOptions workaround appears to have worked!"
            echo "This contradicts the expected behavior. Full logs:"
            cat /tmp/keycloak-logs.txt
            exit 1
          fi

