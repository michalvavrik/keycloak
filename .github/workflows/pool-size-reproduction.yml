        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: postgresql-db
          spec:
            serviceName: postgresql-db-service
            selector:
              matchLabels:
                app: postgresql-db
            replicas: 1
            template:
              metadata:
                labels:
                  app: postgresql-db
              spec:
                containers:
                  - name: postgresql-db
                    image: postgres:15
                    env:
                      - name: POSTGRES_USER
                        value: testuser
                      - name: POSTGRES_PASSWORD
                        value: testpassword
                      - name: POSTGRES_DB
                        value: keycloak
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgres-db
          spec:
            selector:
              app: postgresql-db
            ports:
            - port: 5432
          EOF

          kubectl create secret generic keycloak-db-secret \
            --from-literal=username=testuser \
            --from-literal=password=testpassword

          kubectl wait --for=condition=ready --timeout=120s pod -l app=postgresql-db

      - name: Deploy Keycloak with poolMaxSize=20 (CORRECT FIX)
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: k8s.keycloak.org/v2alpha1
          kind: Keycloak
          metadata:
            name: test-fixed
          spec:
            instances: 1
            db:
              vendor: postgres
              host: postgres-db
              usernameSecret:
                name: keycloak-db-secret
                key: username
              passwordSecret:
                name: keycloak-db-secret
                key: password
              poolInitialSize: 5
              poolMinSize: 5
              poolMaxSize: 20
            hostname:
              hostname: test.local
              strict: false
            http:
              httpEnabled: true
            additionalOptions:
              - name: shutdown-delay
                value: "0s"
          EOF

      - name: Wait and verify successful startup
        run: |
          echo "Waiting 150 seconds for Keycloak startup..."
          sleep 150

          echo "=== Pod Status ==="
          kubectl get pods -l app=keycloak

          echo -e "\n=== Verifying successful startup ==="
          if kubectl logs test-fixed-0 2>&1 | grep -q "Keycloak.*started in"; then
            echo "✅ SUCCESS: Keycloak started successfully with poolMaxSize=20!"
            kubectl logs test-fixed-0 2>&1 | grep "Keycloak.*started in"

            # Verify no acquisition timeouts
            if kubectl logs test-fixed-0 2>&1 | grep -q "acquisition timeout"; then
              echo "❌ FAILURE: Still seeing acquisition timeouts!"
              exit 1
            fi

            # Verify pod is ready
            if kubectl get pod test-fixed-0 -o jsonpath='{.status.containerStatuses[0].ready}' | grep -q "true"; then
              echo "✅ Pod is ready and running"
            fi
            exit 0
          else
            echo "❌ FAILURE: Keycloak did not start successfully!"
            echo "Full logs:"
            kubectl logs test-fixed-0 2>&1 | tail -100
            exit 1
          fi

