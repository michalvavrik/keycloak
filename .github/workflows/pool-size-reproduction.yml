        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: k8s.keycloak.org/v2alpha1
          kind: Keycloak
          metadata:
            name: test-fixed
          spec:
            instances: 1
            db:
              vendor: postgres
              host: postgres-db
              usernameSecret:
                name: keycloak-db-secret
                key: username
              passwordSecret:
                name: keycloak-db-secret
                key: password
              poolInitialSize: 5
              poolMinSize: 5
              poolMaxSize: 20
