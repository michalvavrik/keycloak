      - name: Deploy Keycloak v26.4.7 with kubernetes stack and poolMaxSize=3
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: k8s.keycloak.org/v2alpha1
          kind: Keycloak
          metadata:
            name: test-kubernetes-stack
          spec:
